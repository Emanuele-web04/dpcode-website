name: Validate public surface

on:
  pull_request:
    branches:
      - main
      - docs/public-surface-overhaul
      - docs/getting-started-overhaul
      - docs/provider-guides
      - docs/workflow-guides
      - docs/help-and-troubleshooting
      - docs/quality-seo-aeo
      - marketing/homepage-positioning
  push:
    branches:
      - docs/getting-started-overhaul
      - docs/provider-guides
      - docs/workflow-guides
      - docs/help-and-troubleshooting
      - docs/quality-seo-aeo
      - marketing/homepage-positioning
      - marketing/visual-storytelling

permissions:
  contents: read

jobs:
  validate:
    name: Test, lint, build, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test public-surface contracts
        run: npm run test:docs

      - name: Lint
        run: npm run lint

      - name: Build
        run: VISUAL_TEST=1 npm run build

      - name: Smoke test production routes
        run: npm run test:seo-smoke

      - name: Functional browser checks
        run: npm run test:e2e

      - name: Accessibility checks
        run: npm run test:a11y

      - name: Visual regression checks
        id: visual
        run: npm run test:visual

      - name: Upload visual failure artifacts
        if: ${{ always() && steps.visual.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Production performance checks
        run: npm run test:performance
