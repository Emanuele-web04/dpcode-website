name: Validate documentation

on:
  pull_request:
    branches:
      - main
      - docs/public-surface-overhaul
      - docs/getting-started-overhaul
      - docs/provider-guides
  push:
    branches:
      - docs/getting-started-overhaul
      - docs/provider-guides
      - docs/workflow-guides

permissions:
  contents: read

jobs:
  validate:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test documentation integrity
        run: npm run test:docs

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
