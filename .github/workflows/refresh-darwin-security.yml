name: Refresh Darwin security baselines

on:
  push:
    branches:
      - marketing/visual-storytelling

permissions:
  contents: read

jobs:
  darwin-baselines:
    name: Refresh Darwin visual baselines
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build deterministic production site
        run: VISUAL_TEST=1 npm run build

      - name: Refresh Darwin snapshots
        run: npm run test:visual:update

      - name: Upload Darwin snapshots
        uses: actions/upload-artifact@v4
        with:
          name: darwin-security-baselines
          path: tests/visual/visual.spec.ts-snapshots/*-darwin.png
          if-no-files-found: error
